{{ define "main" }}

<article>
    <h1>{{ .Title }}</h1>
    🗄️ {{ range $k, $v := .GetTerms "tags" }}
        {{- if $k }}, {{ end }}
        <a href="{{ .RelPermalink }}" class="link f5 grow br-pill ba ph3 pv2 mb2 dib black sans-serif no-underline">
        {{- .LinkTitle -}}
        </a>
    {{- end }}

    {{ if .Params.toc }}
        <aside {{ if .Params.tocBorder }} class="toc" {{ end }}>
            {{ .TableOfContents }}
        </aside>
    {{ end }}

    {{ .Content }}
</article>
{{ end }}
