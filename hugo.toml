baseURL = 'https://asd.learnlearn.in'
languageCode = 'en-us'
title = 'ASD'

theme = 'asd'

[params]
feedSections = ["post"]

[taxonomies]
  tag = 'tags'

[permalinks]
  tags = "/tag/:slug"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "ATOM", "rss", "json"]
